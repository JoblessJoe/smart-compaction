<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110d1f"/>
      <stop offset="1" stop-color="#18122d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>

  <text x="64" y="104" fill="#ede9fe" font-size="56" font-weight="700" letter-spacing="-1">smart-compaction</text>
  <text x="66" y="148" fill="#b4a8d8" font-size="23">Let the model compact its own context at a safe point, not mid-step.</text>

  <g font-size="15" font-weight="600">
    <text x="64" y="226" fill="#8b80b0">dsh default</text>
    <text x="64" y="320" fill="#c4b5fd">smart-compaction</text>

    <g transform="translate(290 196)">
      <rect x="0" width="130" height="44" rx="10" fill="#241c3d"/><text x="65" y="28" fill="#cfc6ec" text-anchor="middle">read file</text>
      <rect x="142" width="130" height="44" rx="10" fill="#241c3d"/><text x="207" y="28" fill="#cfc6ec" text-anchor="middle">plan edit</text>
      <rect x="284" width="130" height="44" rx="10" fill="#241c3d"/><text x="349" y="28" fill="#cfc6ec" text-anchor="middle">apply edit</text>
      <rect x="426" width="130" height="44" rx="10" fill="#241c3d"/><text x="491" y="28" fill="#cfc6ec" text-anchor="middle">run tests</text>
      <line x1="278" y1="-14" x2="278" y2="58" stroke="#f87171" stroke-width="3"/>
      <text x="278" y="-20" fill="#f87171" text-anchor="middle" font-size="13">auto-compact at 80%, mid-task</text>
      <text x="580" y="28" fill="#f87171" font-size="15">✕ edit loses its context</text>
    </g>

    <g transform="translate(290 290)">
      <rect x="0" width="130" height="44" rx="10" fill="#2e2152"/><text x="65" y="28" fill="#ede9fe" text-anchor="middle">read file</text>
      <rect x="142" width="130" height="44" rx="10" fill="#2e2152"/><text x="207" y="28" fill="#ede9fe" text-anchor="middle">plan edit</text>
      <rect x="284" width="130" height="44" rx="10" fill="#2e2152"/><text x="349" y="28" fill="#ede9fe" text-anchor="middle">apply edit</text>
      <rect x="426" width="130" height="44" rx="10" fill="#2e2152"/><text x="491" y="28" fill="#ede9fe" text-anchor="middle">run tests</text>
      <line x1="420" y1="-10" x2="420" y2="54" stroke="#a78bfa" stroke-width="3"/>
      <rect x="340" y="62" width="160" height="26" rx="13" fill="#3b2a6b"/>
      <text x="420" y="80" fill="#ddd6fe" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">compact_now</text>
      <text x="580" y="28" fill="#86efac" font-size="15">✓ compacts between tasks</text>
    </g>
  </g>
</svg>
