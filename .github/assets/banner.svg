    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" filter="url(#ic-drop)">
    <path d="M30 15c-4-3.5-11-2.5-12 3-5.5 1-8 7-5 11.5-4 4-1.5 11 4 12 1 5.5 8 8 13 4.5" stroke-width="3.4"/>
